
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202022">
  <title>Meta</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="screen">

    <header class="topbar">
      <button class="back-btn" id="backButton" type="button" aria-label="Atrás">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>

      <div class="logo">
        <img src="image.png" alt="Logo">
      </div>
    </header>

    <form id="login-form" autocomplete="off" novalidate>

      <div class="field-group">
        <input
          class="field"
          id="username"
          name="username"
          type="text"
          placeholder="Nombre de usuario, correo o celular"
          aria-label="Nombre de usuario, correo o celular"
          aria-describedby="username-error"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
        >
        <p class="field-error" id="username-error" aria-live="polite"></p>
      </div>

      <div class="field-group">
        <input
          class="field"
          id="password"
          name="password"
          type="password"
          placeholder="Contraseña"
          aria-label="Contraseña"
          aria-describedby="password-error"
          autocomplete="new-password"
        >
        <p class="field-error" id="password-error" aria-live="polite"></p>
      </div>

      <button type="submit" class="login-btn">
        Iniciar sesión
      </button>

      <a href="#recuperacion" class="forgot" id="forgotButton">
        ¿Olvidaste tu contraseña?
      </a>
    </form>

    <p id="notice" class="notice" role="status" aria-live="polite"></p>

    <div class="spacer"></div>

    <footer class="bottom">
      <button class="signup-btn" id="signupButton" type="button">
        Crear cuenta nueva
      </button>
    </footer>

  </main>
</body>
</html>
